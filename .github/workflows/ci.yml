name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build + Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test --enable-swift-testing
      - name: License check (N-10)
        run: ./Tools/license-check.sh
      - name: Localization check (F-22, T-35)
        run: ./Tools/localization-check.sh

  perf:
    name: Perf budgets (Release, 8.5)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test (Release, fail-build-on-regression)
        run: swift test -c release --enable-swift-testing

  lint:
    name: Lint (SwiftLint strict + SwiftFormat)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters (pinned + sha256 — версия-дрейф brew уронил гейт, урок в SDD 12)
        run: |
          mkdir -p build/lint-tools
          curl -fsSL -o build/lint-tools/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/0.65.1/SwiftLintBinary.artifactbundle.zip"
          shasum -a 256 -c Tools/lint/swiftlint-0.65.1.sha256
          unzip -oq build/lint-tools/swiftlint.zip -d build/lint-tools
          curl -fsSL -o build/lint-tools/swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.0/swiftformat.zip"
          shasum -a 256 -c Tools/lint/swiftformat-0.64.0.sha256
          unzip -oq build/lint-tools/swiftformat.zip -d build/lint-tools
      - name: SwiftLint
        run: build/lint-tools/SwiftLintBinary.artifactbundle/macos/swiftlint --strict
      - name: SwiftFormat
        run: build/lint-tools/swiftformat --lint .
